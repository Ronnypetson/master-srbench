channels:
    - conda-forge
dependencies:
    - pysr==0.16
    - python==3.11
    # julia 1.10 links libutf8proc.so.2, but conda-forge no longer ships
    # utf8proc 2.x. julia 1.12 (current LTS) is built against utf8proc 3.
    - julia=1.12
    - numpy=1.26.4
    - scikit-learn<1.6 # PySR 0.16 uses BaseEstimator._validate_data, removed in scikit-learn 1.6.
